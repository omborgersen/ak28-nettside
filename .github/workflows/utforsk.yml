name: Utforsk handball.no (midlertidig)
on:
  push:
    paths: ['.github/workflows/utforsk.yml', 'tools/utforsk.sh']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hent sider
        run: |
          mkdir -p /tmp/ut && cd /tmp/ut
          bash $GITHUB_WORKSPACE/tools/utforsk.sh
          ls -la
      - name: Lagre på egen gren
        run: |
          cd /tmp/ut && git init -q -b utforsk && git add -A
          git -c user.name=bot -c user.email=bot@ak28.no commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" utforsk
