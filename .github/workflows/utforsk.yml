name: Utforsk handball.no (midlertidig)
on:
  push:
    paths: ['.github/workflows/utforsk.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Hent sider
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          for u in "https://www.handball.no/system/klubbdagbok/?clubId=60756" "https://www.handball.no/system/kamper/lag/?lagid=439844"; do
            echo "=================== $u"
            curl -sL -A "$UA" "$u" -o p.html -w "HTTP %{http_code} %{size_download}\n"
            echo "--- scripts/ajax/api:"
            grep -oiE '(src|href|data-[a-z-]+|url)\s*[=:]\s*"[^"]*(ajax|api|json|kamp|match|dagbok|termin)[^"]*"' p.html | sort -u | head -60
            echo "--- forms/data attrs:"
            grep -oiE '<(form|div|table)[^>]*(data-|id=)[^>]*>' p.html | grep -iE 'kamp|match|dagbok|termin|club|lag' | head -30
            echo "--- table rows sample:"
            grep -c '<tr' p.html
            python3 - <<'PY'
          import re
          s=open('p.html',encoding='utf-8',errors='ignore').read()
          i=s.find('<table')
          print(s[i:i+3000] if i>=0 else 'ingen tabell')
          for m in re.finditer(r'<script[^>]*>(.*?)</script>', s, re.S):
              t=m.group(1)
              if re.search(r'ajax|fetch|\$\.get|url', t, re.I) and len(t)<4000:
                  print('--- inline script:\n', t[:1500])
          PY
          done
