name: Utforsk handball.no (midlertidig)
on:
  push:
    paths: ['.github/workflows/utforsk.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Hent sider
        run: |
          mkdir ut && cd ut
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          curl -sL -A "$UA" "https://www.handball.no/system/klubbdagbok/?clubId=60756" -o klubbdagbok.html -w "%{http_code} %{size_download}\n" || true
          curl -sL -A "$UA" "https://www.handball.no/system/kamper/lag/?lagid=439844" -o lag.html -w "%{http_code} %{size_download}\n" || true
          curl -sL -A "$UA" "https://www.handball.no/system/kamper/klubb/?klubbid=60756" -o klubb.html -w "%{http_code} %{size_download}\n" || true
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: sider
          path: ut/
